global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'turtle_manager'
    static_configs:
      - targets: ['host.docker.internal:9091']  # Изменено с localhost
    metrics_path: '/metrics'
    
  - job_name: 'turtle_controller'
    static_configs:
      - targets: ['host.docker.internal:9092']  # Изменено с localhost
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']