repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
  
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format-14 -i
        language: system
        files: \.(cpp|hpp|cc|h)$
      
      - id: cppcheck
        name: cppcheck
        entry: cppcheck --enable=all --suppress=missingIncludeSystem
        language: system
        files: \.(cpp|hpp)$
  
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.11
    hooks:
      - id: ruff
        args: [--fix]