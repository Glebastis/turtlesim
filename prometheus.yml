global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'turtle_manager'
    static_configs:
      - targets: ['turtles_app:9091'] 

  - job_name: 'turtle_controller'
    static_configs:
      - targets: ['turtles_app:9092'] 

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
