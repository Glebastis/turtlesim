version: '3.8'

services:
  turtlesim:
    image: ros:humble-ros-base
    container_name: turtlesim_test
    network_mode: host
    command: ros2 run turtlesim turtlesim_node
    healthcheck:
      test: ["CMD", "ros2", "node", "list", "|", "grep", "turtlesim"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: test_runner
    network_mode: host
    depends_on:
      turtlesim:
        condition: service_healthy
    environment:
      ROS_DOMAIN_ID: "42"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    volumes:
      - ./logs:/var/log/ros2
      - ./test_results:/test_results
    command: ros2 launch my_robot_package test_launch.py
    restart: "no"