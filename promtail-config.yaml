clients:
  - url: http://localhost:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 102400

scrape_configs:
  - job_name: 'ros2_logs'
    static_configs:
      - targets: ['localhost']
        labels:
          job: 'ros2'
          __path__: '/var/log/ros2/**/*.log'
    pipeline_stages:
      - regex:
          expression: '\[(?P<severity>\w+)\s+(?P<timestamp>[^\]]+)\]\s+\[(?P<node>[^\]]+)\]:\s+(?P<message>.*)'
      - labels:
          severity: ''
          node: ''

  - job_name: 'docker_logs'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'